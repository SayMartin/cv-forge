name: Build and push image

# ─────────────────────────────────────────────────────────────────────────────
# **Never add `pull_request` to this list.** The `migrate` job below runs on a
# self-hosted runner inside a home network, with read access to production's
# `.env` and a route to the database. A `pull_request` trigger checks out the
# *contributor's* code and runs it in this repository's context — so on a public
# repo, anyone who can open a pull request would get code execution on that
# machine. GitHub warns about precisely this when a public repo has a
# self-hosted runner.
#
# `push` to `main` is safe because only someone with write access can cause it,
# and a fork cannot push here at all. Note the corollary: **write access to this
# repository is code execution on the server.** That is fine for one maintainer
# and something to think hard about before adding a second.
#
# If a PR build is ever genuinely wanted, put it in its own workflow that runs
# exclusively on `ubuntu-latest` and touches no self-hosted runner.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]

jobs:
  # Separate tag exposing the `builder` stage (full node_modules incl. Prisma CLI),
  # used on the server to run `prisma migrate deploy` without building anything locally.
  build-migrator:
    runs-on: ubuntu-latest
    if: github.repository == 'SayMartin/cv-forge'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          push: true
          tags: ghcr.io/saymartin/cv-forge:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs directly on smurfserver so it can reach the postgres_default docker
  # network without exposing the database or the server to the internet.
  migrate:
    needs: build-migrator
    runs-on: self-hosted
    if: github.repository == 'SayMartin/cv-forge'
    steps:
      # The path to the server's .env, as a repo SECRET rather than a literal
      # value here, and not a variable: this file is public, and so are the
      # Actions logs of a public repo. Every `run` step is echoed there with its
      # expressions already substituted, and only secrets are masked.
      #
      # Set at Settings -> Secrets and variables -> Actions -> Secrets:
      #   SERVER_ENV_FILE = /path/to/cv-forge/.env
      #
      # Passed through `env:` rather than interpolated into the script, which is
      # the documented way to hand a secret to a shell — the value never becomes
      # part of the command text.
      - name: Apply pending Prisma migrations
        env:
          SERVER_ENV_FILE: ${{ secrets.SERVER_ENV_FILE }}
        run: |
          # Trimmed, because a secret pasted with a trailing newline keeps it.
          # `docker run --env-file` then looks for a path ending in a newline and
          # dies with exit 125 — and since the value is masked, the log reads
          # "open ***" with the rest of the message on the next line, which
          # reveals almost nothing about the cause. It cost a failed deploy once.
          env_file="$(printf '%s' "$SERVER_ENV_FILE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -z "$env_file" ]; then
            echo "::error::Repo secret SERVER_ENV_FILE is not set — see the comment in this workflow."
            exit 1
          fi

          # -r, not -f: docker needs to *read* the file, so an unreadable one is
          # the same failure as a missing one and deserves the same clear error.
          # Checked before `docker pull` so a misconfigured runner fails in a
          # second instead of after fetching the image.
          if [ ! -r "$env_file" ]; then
            echo "::error::SERVER_ENV_FILE does not point at a readable file on this runner. Check the path and its permissions."
            exit 1
          fi

          docker pull ghcr.io/saymartin/cv-forge:migrator
          docker run --rm \
            --network postgres_default \
            --env-file "$env_file" \
            ghcr.io/saymartin/cv-forge:migrator \
            npx prisma migrate deploy

  # Built and pushed last so Watchtower only picks up new code once the
  # database schema it depends on has already been migrated above.
  build-app:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.repository == 'SayMartin/cv-forge'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            S3_PUBLIC_URL=https://files.appfinningar.se
          tags: |
            ghcr.io/saymartin/cv-forge:latest
            ghcr.io/saymartin/cv-forge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
