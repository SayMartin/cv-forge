name: Build and push image

on:
  push:
    branches: [main]

jobs:
  # Separate tag exposing the `builder` stage (full node_modules incl. Prisma CLI),
  # used on the server to run `prisma migrate deploy` without building anything locally.
  build-migrator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          push: true
          tags: ghcr.io/saymartin/cv-forge:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs directly on smurfserver so it can reach the postgres_default docker
  # network without exposing the database or the server to the internet.
  migrate:
    needs: build-migrator
    runs-on: self-hosted
    steps:
      # A repo SECRET rather than a literal path, and not a variable: this file
      # is public, and so are the Actions logs of a public repo. Every `run`
      # step is echoed there with its expressions already substituted, and only
      # secrets are masked — a `vars.` value would be printed in full, which
      # would defeat the point of moving it out of this file. The path is not
      # confidential in itself; the masking is what keeps it out of the log.
      #
      # Set it once at Settings -> Secrets and variables -> Actions -> Secrets:
      #   SERVER_ENV_FILE = /path/to/cv-forge/.env
      #
      # Checked explicitly so an unset secret fails here, with a readable
      # message, instead of reaching `docker run` as an empty --env-file and
      # failing with something that looks like a Docker problem. This job
      # already fails closed by design; it should also fail legibly.
      - name: Check runner configuration
        run: |
          if [ -z "${{ secrets.SERVER_ENV_FILE }}" ]; then
            echo "::error::Repo secret SERVER_ENV_FILE is not set — see the comment in this workflow."
            exit 1
          fi

      - name: Apply pending Prisma migrations
        run: |
          docker pull ghcr.io/saymartin/cv-forge:migrator
          docker run --rm \
            --network postgres_default \
            --env-file "${{ secrets.SERVER_ENV_FILE }}" \
            ghcr.io/saymartin/cv-forge:migrator \
            npx prisma migrate deploy

  # Built and pushed last so Watchtower only picks up new code once the
  # database schema it depends on has already been migrated above.
  build-app:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            S3_PUBLIC_URL=https://files.appfinningar.se
          tags: |
            ghcr.io/saymartin/cv-forge:latest
            ghcr.io/saymartin/cv-forge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
