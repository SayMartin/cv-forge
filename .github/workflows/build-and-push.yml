name: Build and push image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/saymartin/cv-forge:latest
            ghcr.io/saymartin/cv-forge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Separate tag exposing the `builder` stage (full node_modules incl. Prisma CLI),
      # used on the server to run `prisma migrate deploy` without building anything locally.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ghcr.io/saymartin/cv-forge:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max
